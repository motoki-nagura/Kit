command = """scales = np.arange(1,50)       #  scale. Frequency depends on it
wavelet_name = 'cmor2.0-1.0'   #  wavelet function in the form of 'cmorB-C.'
                               #      cmor = Complex Morlet
                               #      B = 2.0 (Torrence and Compo 1998, Table 1)
                               #      C = 1.0 (Torrence and Compo 1998, p.63, after Eq.1).
                               #      Note the frequency of the wavelet function is
                               #        2*pi*C. For 2*pi*C to be about 6, C = 1.
sampling_period = 0.2          #  sampling period of input time series
coef, freq = pywt.cwt(data=invar, scales=scales, sampling_period=sampling_period, \\
                      wavelet=wavelet_name)
power = np.abs(coef)**2        #  Torrence and Compo (1998, p.65) 

for j in range(np.shape(power)[1]):
    power[:,j] = power[:,j] *freq            #  Adjusted power, Liu et al. (2007)

