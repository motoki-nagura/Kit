description = "datetime - make labels for the time axis"
command = """from datetime import date

idx = time.units.index('-')             #  find reference time
iyear  = int(time.units[idx-4:idx])
imonth = int(time.units[idx+1:idx+3])
iday   = int(time.units[idx+4:idx+6])
time_ref = date(iyear,imonth,iday)

ystrt=1945
yend=2025
dt = 10
nt = int( (yend-ystrt+1)/dt ) + 1

time_label1 = np.zeros(nt)
time_label2 = []

for i in range(nt):
    tmp = date(ystrt+i*dt,1,1) - time_ref
